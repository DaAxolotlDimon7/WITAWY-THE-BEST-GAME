<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Clicker - Advanced Edition</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: var(--card-bg);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--accent);
    }

    .stats-bar {
      display: flex;
      gap: 2rem;
      font-size: 1.1rem;
    }

    .main-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
      gap: 1.5rem;
      padding: 1.5rem;
      overflow: hidden;
    }

    .click-section {
      background: var(--card-bg);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 1px solid #334155;
    }

    #quantumButton {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent) 0%, #0369a1 100%);
      border: 4px solid #bae6fd;
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
      transition: transform 0.05s ease, box-shadow 0.1s ease;
      user-select: none;
    }

    #quantumButton:active {
      transform: scale(0.95);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
    }

    .floating-text {
      position: absolute;
      color: #4ade80;
      font-weight: bold;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-50px); }
    }

    .shop-section {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      border: 1px solid #334155;
      overflow-y: auto;
    }

    .shop-section h2 {
      margin-bottom: 1rem;
      font-size: 1.25rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.5rem;
    }

    .upgrade-list {
      display: flex;
      flex-direction: column;
      gap: 0.75srem;
    }

    .upgrade-item {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .upgrade-info h3 {
      font-size: 1rem;
    }

    .upgrade-info p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .buy-btn {
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .buy-btn:hover {
      background: var(--accent-hover);
      color: white;
    }

    .buy-btn:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .controls-bar {
      background: var(--card-bg);
      padding: 0.75rem 2rem;
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      border-top: 1px solid #334155;
    }

    .ctrl-btn {
      background: #334155;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .ctrl-btn.danger {
      background: #ef4444;
    }
  </style>
</head>
<body>

  <header>
    <h1>Quantum Clicker</h1>
    <div class="stats-bar">
      <div>Quanta: <span id="scoreDisplay">0</span></div>
      <div>Per Sec (CPS): <span id="cpsDisplay">0</span></div>
      <div>Per Click (GPC): <span id="gpcDisplay">1</span></div>
      <div>Prestige: <span id="prestigeDisplay">1x</span></div>
    </div>
  </header>

  <main class="main-container">
    <div class="click-section" id="clickArea">
      <button id="quantumButton">CLICK ME</button>
    </div>

    <div class="shop-section">
      <h2>Quantum Facilities & Upgrades</h2>
      <div class="upgrade-list" id="upgradeList">
        <!-- Dynamically populated via JS -->
      </div>
    </div>
  </main>

  <div class="controls-bar">
    <button class="ctrl-btn" onclick="prestigeGame()">Prestige (Reset for +Multiplier)</button>
    <button class="ctrl-btn danger" onclick="resetGame()">Hard Reset</button>
  </div>

  <script>
    let score = 0;
    let gpc = 1;
    let cps = 0;
    let prestigeMultiplier = 1;

    const upgrades = [
      { id: 'cursor', name: 'Nano-Bot', desc: '+1 Quanta per click', cost: 15, gpcAdd: 1, cpsAdd: 0, count: 0, costMult: 1.15 },
      { id: 'server', name: 'Quantum Node', desc: '+2 Quanta per second', cost: 50, gpcAdd: 0, cpsAdd: 2, count: 0, costMult: 1.15 },
      { id: 'ai', name: 'Neural Core', desc: '+15 Quanta per second', cost: 350, gpcAdd: 0, cpsAdd: 15, count: 0, costMult: 1.15 },
      { id: 'gateway', name: 'Dimension Rift', desc: '+100 Quanta per second', cost: 2000, gpcAdd: 0, cpsAdd: 100, count: 0, costMult: 1.15 },
      { id: 'hyperion', name: 'Hyperion Engine', desc: '+500 Quanta per click', cost: 15000, gpcAdd: 500, cpsAdd: 0, count: 0, costMult: 1.20 }
    ];

    const scoreDisplay = document.getElementById('scoreDisplay');
    const cpsDisplay = document.getElementById('cpsDisplay');
    const gpcDisplay = document.getElementById('gpcDisplay');
    const prestigeDisplay = document.getElementById('prestigeDisplay');
    const quantumButton = document.getElementById('quantumButton');
    const clickArea = document.getElementById('clickArea');
    const upgradeList = document.getElementById('upgradeList');

    function renderShop() {
      upgradeList.innerHTML = '';
      upgrades.forEach((u, index) => {
        const el = document.createElement('div');
        el.className = 'upgrade-item';
        el.innerHTML = `
          <div class="upgrade-info">
            <h3>${u.name} (Owned: ${u.count})</h3>
            <p>${u.desc}</p>
            <p>Cost: ${Math.floor(u.cost)} Quanta</p>
          </div>
          <button class="buy-btn" id="buy-${u.id}" onclick="buyUpgrade(${index})">Buy</button>
        `;
        upgradeList.appendChild(el);
      });
      updateUI();
    }

    function updateUI() {
      scoreDisplay.innerText = Math.floor(score).toLocaleString();
      cpsDisplay.innerText = Math.floor(cps * prestigeMultiplier).toLocaleString();
      gpcDisplay.innerText = Math.floor(gpc * prestigeMultiplier).toLocaleString();
      prestigeDisplay.innerText = prestigeMultiplier.toFixed(1) + 'x';

      upgrades.forEach((u) => {
        const btn = document.getElementById(`buy-${u.id}`);
        if (btn) {
          btn.disabled = score < u.cost;
        }
      });
    }

    function createFloatingText(text, x, y) {
      const floatEl = document.createElement('div');
      floatEl.className = 'floating-text';
      floatEl.innerText = text;
      floatEl.style.left = `${x}px`;
      floatEl.style.top = `${y}px`;
      clickArea.appendChild(floatEl);
      setTimeout(() => floatEl.remove(), 800);
    }

    quantumButton.addEventListener('click', (e) => {
      const earned = gpc * prestigeMultiplier;
      score += earned;

      const rect = quantumButton.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      createFloatingText(`+${Math.floor(earned)}`, x, y);

      updateUI();
      saveGame();
    });

    function buyUpgrade(index) {
      const u = upgrades[index];
      if (score >= u.cost) {
        score -= u.cost;
        u.count++;
        gpc += u.gpcAdd;
        cps += u.cpsAdd;
        u.cost = u.cost * u.costMult;
        renderShop();
        saveGame();
      }
    }

    // Game loop (10 times per second)
    setInterval(() => {
      score += (cps * prestigeMultiplier) / 10;
      updateUI();
    }, 100);

    // Auto-save every 5 seconds
    setInterval(() => {
      saveGame();
    }, 5000);

    function saveGame() {
      const gameState = { score, gpc, cps, prestigeMultiplier, upgrades };
      localStorage.setItem('quantumClickerSave', JSON.stringify(gameState));
    }

    function loadGame() {
      const saved = localStorage.getItem('quantumClickerSave');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          score = data.score || 0;
          gpc = data.gpc || 1;
          cps = data.cps || 0;
          prestigeMultiplier = data.prestigeMultiplier || 1;
          if (data.upgrades) {
            data.upgrades.forEach((savedU, i) => {
              if (upgrades[i]) {
                upgrades[i].count = savedU.count;
                upgrades[i].cost = savedU.cost;
              }
            });
          }
        } catch (e) {
          console.error('Failed to load save');
        }
      }
      renderShop();
    }

    function prestigeGame() {
      if (score < 10000) {
        alert('You need at least 10,000 Quanta to prestige!');
        return;
      }
      const bonus = Math.floor(score / 5000);
      prestigeMultiplier += bonus * 0.5;
      score = 0;
      gpc = 1;
      cps = 0;
      upgrades.forEach(u => {
        u.count = 0;
        u.cost = u.cost / Math.pow(u.costMult, u.count);
      });
      renderShop();
      saveGame();
    }

    function resetGame() {
