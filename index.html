<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Clicker Pro</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; border-right: 1px solid #334155; }
        aside { width: 380px; display: flex; flex-direction: column; background: var(--surface); }
        .header { padding: 1.5rem; border-bottom: 1px solid #334155; }
        #score { font-size: 3rem; font-weight: 800; color: var(--accent); }
        #cps { font-size: 1rem; color: var(--text-muted); margin-top: 0.25rem; }
        .click-area { position: relative; width: 260px; height: 260px; background: radial-gradient(circle, #2563eb 0%, #1d4ed8 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 5rem; cursor: pointer; user-select: none; box-shadow: 0 0 40px rgba(56, 189, 248, 0.2); transition: transform 0.05s; }
        .click-area:active { transform: scale(0.95); }
        .shop-list { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
        .shop-item { background: var(--bg); padding: 1rem; border-radius: 0.5rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid #334155; transition: all 0.2s; }
        .shop-item:hover:not(.disabled) { border-color: var(--accent); background: #131e35; }
        .shop-item.disabled { opacity: 0.5; cursor: not-allowed; }
        .item-info h3 { font-size: 1rem; }
        .item-info p { font-size: 0.85rem; color: var(--text-muted); }
        .item-cost { font-weight: 700; color: var(--accent); }
        .floating-text { position: absolute; color: var(--accent); font-weight: 800; font-size: 1.5rem; pointer-events: none; animation: floatUp 0.8s ease-out forwards; z-index: 10; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-100px) scale(0.8); } }
    </style>
</head>
<body>

    <main>
        <div class="click-area" id="clicker">⚛️</div>
    </main>

    <aside>
        <div class="header">
            <div id="score">0</div>
            <div id="cps">0.0 CPS</div>
        </div>
        <div class="shop-list" id="shop"></div>
    </aside>

    <script>
        const state = {
            points: 0,
            totalClicks: 0,
            upgrades: { auto: 0, factory: 0, quantum: 0 }
        };

        const config = [
            { id: 'auto', name: 'Auto-Spanner', baseCost: 15, cps: 0.1 },
            { id: 'factory', name: 'Fusion Engine', baseCost: 100, cps: 1 },
            { id: 'quantum', name: 'Singularity Grid', baseCost: 1100, cps: 8 }
        ];

        // Load Save Data Safely
        try {
            const saved = localStorage.getItem('quantum_clicker_save');
            if (saved) {
                const parsed = JSON.parse(saved);
                Object.assign(state, parsed);
            }
        } catch (e) { console.error("Failed to load save", e); }

        const clicker = document.getElementById('clicker');
        const scoreDisplay = document.getElementById('score');
        const cpsDisplay = document.getElementById('cps');
        const shopElement = document.getElementById('shop');

        function getCost(item) {
            return Math.floor(item.baseCost * Math.pow(1.15, state.upgrades[item.id] || 0));
        }

        function getCps() {
            return config.reduce((acc, item) => acc + ((state.upgrades[item.id] || 0) * item.cps), 0);
        }

        function updateUI() {
            scoreDisplay.textContent = Math.floor(state.points).toLocaleString();
            cpsDisplay.textContent = `${getCps().toFixed(1)} CPS`;
            
            config.forEach(item => {
                const btn = document.getElementById(`btn-${item.id}`);
                const cost = getCost(item);
                if (btn) {
                    btn.querySelector('.item-cost').textContent = cost.toLocaleString();
                    btn.querySelector('.item-count').textContent = state.upgrades[item.id] || 0;
                    if (state.points >= cost) {
                        btn.classList.remove('disabled');
                    } else {
                        btn.classList.add('disabled');
                    }
                }
            });
        }

        // Build Shop
        config.forEach(item => {
            const div = document.createElement('div');
            div.className = 'shop-item';
            div.id = `btn-${item.id}`;
            div.innerHTML = `
                <div class="item-info">
                    <h3>${item.name} (<span class="item-count">0</span>)</h3>
                    <p>+${item.cps} CPS</p>
                </div>
                <div class="item-cost">0</div>
            `;
            div.addEventListener('click', () => {
                const cost = getCost(item);
                if (state.points >= cost) {
                    state.points -= cost;
                    state.upgrades[item.id] = (state.upgrades[item.id] || 0) + 1;
                    updateUI();
                    saveGame();
                }
            });
            shopElement.appendChild(div);
        });

        // Click Handling with Floating Numbers
        clicker.addEventListener('click', (e) => {
            state.points += 1;
            state.totalClicks += 1;
            
            const float = document.createElement('div');
            float.className = 'floating-text';
            float.textContent = '+1';
            float.style.left = `${e.clientX - 15}px`;
            float.style.top = `${e.clientY - 20}px`;
            document.body.appendChild(float);
            setTimeout(() => float.remove(), 800);

            updateUI();
        });

        // Game Loop Framework (Delta Time Driven)
        let lastTime = performance.now();
        function gameLoop(now) {
            const delta = (now - lastTime) / 1000;
            lastTime = now;

            if (delta > 0) {
                state.points += getCps() * delta;
                updateUI();
            }
            requestAnimationFrame(gameLoop);
        }

        function saveGame() {
            localStorage.setItem('quantum_clicker_save', JSON.stringify(state));
        }

        // Auto Save Interval (Every 15 Seconds)
        setInterval(saveGame, 15000);

        // Run Engine
        updateUI();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
